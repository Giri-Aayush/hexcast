[build]
  # Install only the web app + its shared package, not the whole monorepo. The
  # pipeline workspace (28 deps incl. sharp, a native binary) is never used by the
  # site and only slowed every build. Falls back to a full install if scoping ever
  # misses something, so the build cannot break from this.
  command = "(npm ci --include-workspace-root -w web -w packages/shared || npm ci) && npm run build"
  publish = "web/.next"
  # Skip the build entirely when nothing the deployed site depends on changed.
  # Half of one heavy session's builds were pipeline-only PRs (summarizer/config)
  # that produce an identical site — a wasted build each. `ignore` exits 0 to skip:
  # git diff --quiet exits 0 when these paths are unchanged, so a pipeline-only
  # change skips, and any web/, shared-package, dependency, or config change builds.
  # Deploy-preview builds are pure waste for a solo dev (we verify on the dev deploy
  # and prod, never on preview URLs), so skip them outright at the config level.
  # For branch/prod, still skip when nothing the site depends on changed. exit 0 = skip.
  ignore = "if [ \"$CONTEXT\" = \"deploy-preview\" ]; then exit 0; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web/ packages/ package.json package-lock.json netlify.toml" 

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Ensure HTML pages are revalidated on each request (no stale CDN cache)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed static assets can be cached immutably
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
