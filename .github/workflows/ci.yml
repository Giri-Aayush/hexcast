name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pipeline tests
        run: npm run test:pipeline

      - name: Web tests
        run: npm run test:web

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-key
          # Build-time placeholders — the build never opens a connection.
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          BETTER_AUTH_SECRET: ci-placeholder-secret
